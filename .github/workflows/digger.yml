name: Digger IaC

on:
  pull_request:
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  pull-requests: write
  issues: write
  statuses: write

jobs:
  digger:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run Digger
        id: digger
        uses: diggerhq/digger@v0.6.0
        with:
          setup-terraform: true
          terraform-version: "1.7.0"
          no-backend: "true"
          configure-checkout: false
          disable-locking: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_CONTEXT: ${{ toJson(github) }}

      - name: Post plan instructions
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- digger-instructions -->';
            const pr = context.issue.number;
            const repo = context.repo.owner + '/' + context.repo.repo;
            const applyUrl = `https://github.com/${repo}/actions/workflows/apply.yml`;
            const success = '${{ steps.digger.outcome }}' === 'success';
            const status = success ? '✅' : '❌';
            const statusLabel = success
              ? 'Plan executado com sucesso — pronto para apply'
              : 'Plan falhou — veja os detalhes acima';

            const body = [
              marker,
              `## ${status} Terraform Plan — ${statusLabel}`,
              '',
              '> Revise o plan do Digger acima antes de aplicar.',
              '',
              '---',
              '',
              '### Aplicar mudanças',
              '',
              success
                ? `**[▶ Aplicar via GitHub Actions](${applyUrl})**`
                : '',
              success
                ? `> Clique no link acima → **Run workflow** → informe o número desta PR: \`${pr}\``
                : '',
              '',
              '---',
              `_Atualizado em: ${new Date().toISOString().replace('T', ' ').slice(0, 19)} UTC_`,
            ].filter(l => l !== undefined).join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            });

            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: pr,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
